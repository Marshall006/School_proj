# Pile complete de developpement : base, API, tableau de bord.
#
#   docker compose up --build
#   docker compose exec api python -m app.cli demo
#
# L'application enfant (Expo) se lance a part : `make mobile`.

services:
  db:
    image: postgres:16-alpine
    container_name: koda-db
    environment:
      POSTGRES_USER: koda
      POSTGRES_PASSWORD: koda
      POSTGRES_DB: koda
      # Tri et comparaisons corrects pour le francais.
      LANG: fr_FR.utf8
    volumes:
      - koda-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koda -d koda"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    container_name: koda-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      KODA_ENVIRONMENT: dev
      KODA_DEBUG: "true"
      KODA_DATABASE_URL: postgresql+asyncpg://koda:koda@db:5432/koda
      KODA_SECRET_KEY: ${KODA_SECRET_KEY:-changez-cette-cle-en-production-0123456789}
      KODA_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      KODA_SEED_ON_STARTUP: "true"
      KODA_FIREBASE_PROJECT_ID: ${KODA_FIREBASE_PROJECT_ID:-}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: koda-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_FIREBASE_ENABLED: "false"
    ports:
      - "3000:3000"

volumes:
  koda-db-data:
